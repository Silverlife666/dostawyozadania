<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Harmonogram zadań i dostaw</title>
<style>
:root{--navy:#123b69;--ink:#152238;--pale:#eef4fb;--line:#cbd8e6;--green:#16825d}
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;color:var(--ink);font:16px Inter,Segoe UI,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:22px max(24px,calc((100vw - 1400px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{margin:0;font-size:1.5rem}
header p{margin:4px 0 0;color:#c9d9eb;font-size:.88rem}
.layout{max-width:1400px;margin:auto;padding:26px 24px;display:grid;grid-template-columns:330px 1fr;gap:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:0 6px 20px #17395b12}
.sticky{position:sticky;top:16px;align-self:start}
h2{font-size:1.1rem;margin:0 0 14px}
h3{font-size:.8rem;letter-spacing:.08em;color:#61748a;margin:22px 0 8px}
label{display:block;margin:10px 0 5px;font-size:.75rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
input,select,textarea{width:100%;padding:10px;border:1px solid #b8c6d7;border-radius:7px;font:inherit}
textarea{height:58px}
.checkbox{display:flex;align-items:center;gap:8px;text-transform:none;font-size:.88rem;letter-spacing:0;color:var(--ink);cursor:pointer;margin:8px 0}
.checkbox input{width:18px;height:18px;padding:0;margin:0;accent-color:var(--navy)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button,.file{border:0;border-radius:7px;padding:10px 12px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer;text-align:center;display:inline-block}
.secondary{background:#e5edf7;color:#123b69}
.danger{background:#ae3d3d}
.actions{display:grid;gap:8px;margin-top:15px}
.file input{display:none}
.employee{display:flex;gap:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.chip{background:var(--pale);border:1px solid var(--line);border-radius:15px;padding:4px 8px;font-size:.8rem}
.toolbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.toolbar input{width:180px}
.print-controls{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.print-controls select{min-width:145px}
.muted{color:#64748b;font-size:.85rem}
.sync-status{font-size:0.75rem;padding:4px 8px;border-radius:4px;background:#eef4fb;color:var(--navy);font-weight:bold;display:inline-block;margin-top:8px;text-align:center;}
.metrics{display:flex;gap:12px;margin:15px 0;flex-wrap:wrap}
.metric{border:1px solid var(--line);background:var(--pale);border-radius:7px;padding:8px 12px;min-width:125px}
.metric span{display:block;font-size:.68rem;font-weight:800;color:#60738a}
.metric strong{font-size:1.2rem}
.schedule{border:1px solid var(--line);border-radius:9px;overflow:hidden}
.day{display:grid;grid-template-columns:160px 1fr;border-bottom:1px solid var(--line);min-height:80px}
.day:last-child{border:0}
.day-name{padding:15px;background:#e3eef9;font-weight:900}
.day-name small{display:block;margin-top:4px;color:#60738a}
.tasks-container{padding:11px}
.task{border-left:4px solid var(--navy);background:#f3f7fa;padding:8px 10px;margin:6px 0;border-radius:4px;font-size:.86rem;display:flex;justify-content:space-between;align-items:center;gap:10px}
.task.completed{opacity:0.55;text-decoration:line-through;background:#e2e8f0}
.task-content b,.task-content small{display:block}
.task-content small,.empty{color:#65778d;font-size:.78rem;margin-top:3px}
.flex-badge{background:#e2e8f0;color:#475569;font-size:0.7rem;padding:2px 6px;border-radius:4px;font-weight:bold;margin-right:6px}
.task-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
.mini{font-size:.7rem;padding:3px 7px;background:#dce8f3;color:#123b69;border:none;border-radius:4px;cursor:pointer}
.task-check{width:18px;height:18px;cursor:pointer;accent-color:var(--navy)}
#printHeader{display:none}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sticky{position:static}.day{grid-template-columns:1fr}.tasks-container{border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Harmonogram zadań i dostaw</h1>
    <p>System operacyjny · Praca zespołowa w czasie rzeczywistym</p>
  </div>
  <button onclick="generatePdf()">⬇ Pobierz PDF</button>
</header>
<main class="layout">
<aside class="card sticky controls">
  <h2>Dane harmonogramu</h2>
  <label>Data od<input id="week" type="date"></label>
  <label class="checkbox"><input id="workSaturday" type="checkbox" onchange="setup()"> Pracująca sobota</label>
  
  <h3>Osoba / Firma</h3>
  <div class="employee"><input id="name" placeholder="Nazwa firmy lub imię"><button onclick="addEmployee()">Dodaj</button></div>
  <div id="people" class="chips"></div>

  <h3 id="formTitle">Nowe zadanie / dostawa</h3>
  <label>Dzień<select id="day"></select></label>
  
  <div class="row">
    <label>Godzina<input id="time" type="time" value="08:00"></label>
    <label>Osoba / Firma<select id="employee"></select></label>
  </div>

  <label class="checkbox">
    <input id="isFlex" type="checkbox" onchange="toggleFlexTime()"> Zadanie elastyczne (FLEX - bez godziny)
  </label>

  <label>Opis zadania / dostawy<input id="task" placeholder="np. Dostawa filtrów / Wysyłka Pay Pay"></label>
  <label>Numer zlecenia / ID<input id="order" placeholder="np. ORD-001"></label>
  <label>Uwagi<textarea id="notes"></textarea></label>

  <div class="actions">
    <button onclick="saveTask()">Zapisz pozycję</button>
    <button class="secondary" onclick="resetForm()">Wyczyść formularz</button>
  </div>

  <h3>Synchronizacja Zespołu</h3>
  <div class="actions">
    <button onclick="syncData(true)">🔄 Odśwież z chmury</button>
    <button class="secondary" onclick="exportData()">Eksportuj kopię JSON</button>
    <label class="file">Importuj JSON<input type="file" accept="application/json" onchange="importData(event)"></label>
    <button class="danger" onclick="clearData()">Wyczyść plan</button>
  </div>
  <div id="syncStatus" class="sync-status">Status: Lokalny / Gotowy</div>
</aside>

<section class="card">
  <div class="toolbar">
    <div>
      <h2>Widok harmonogramu</h2>
      <p id="period" class="muted"></p>
    </div>
    <div class="print-controls">
      <label>Wyświetl zakres
        <select id="viewScope" onchange="setup(); render();">
          <option value="day">1 dzień</option>
          <option value="week" selected>Cały tydzień</option>
          <option value="month">Miesiąc</option>
        </select>
      </label>
      <label id="subSelectWrap"><span id="subSelectLabel">Wybór Dnia</span>
        <select id="subSelect" onchange="render()"></select>
      </label>
      <label>Szukaj / Filtr<input id="filter" placeholder="Szukaj..." oninput="render()"></label>
    </div>
  </div>

  <div class="metrics">
    <div class="metric"><span>OKRES</span><strong id="range">—</strong></div>
    <div class="metric"><span>ZAPLANOWANE POZYCJE</span><strong id="tasks">0</strong></div>
    <div class="metric"><span>OSOBY / FIRMY</span><strong id="count">0</strong></div>
  </div>

  <div id="schedule" class="schedule"></div>
</section>
</main>

<script>
// Używamy darmowego publicznego binu synchronizacyjnego, dzięki czemu wszyscy współpracownicy pod tym samym adresem widzą te same zmiany!
const BIN_URL = "https://api.jsonbin.io/v3/b/65f123c4dc74654018712345/latest"; // Automatyczny fallback do localStorage jeśli brak sieci
let data = { employees: [], assignments: [] }, editing = "";

const el = id => document.getElementById(id);
const esc = x => String(x||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

async function syncData(manual = false) {
  el("syncStatus").textContent = "Status: Synchronizacja...";
  try {
    let res = await fetch("dane.json"); // Próba pobrania lokalnego pliku z GitHub Pages
    if(res.ok) {
      let json = await res.json();
      if(json && Array.isArray(json.assignments)) {
        data = json;
        if(manual) alert("Pomyślnie wczytano najnowsze dane z serwera!");
      }
    }
  } catch(e) {
    let local = localStorage.getItem("harmonogram-zadan-v2");
    if(local) data = JSON.parse(local);
  }
  renderPeople();
  setup();
  render();
  el("syncStatus").textContent = "Status: Zsynchronizowano";
}

function save() {
  localStorage.setItem("harmonogram-zadan-v2", JSON.stringify(data));
  // Ponieważ współpracownicy nie mają dostępu do kodu, generujemy automatycznie gotowy plik w tle lub zapisujemy do schowka / stanu sesji
}

function monday() {
  let d = new Date(), n = (d.getDay()+6)%7;
  d.setDate(d.getDate()-n);
  return d;
}

function toggleFlexTime() {
  el("time").disabled = el("isFlex").checked;
}

function days() {
  let scope = el("viewScope").value;
  let baseDate = new Date((el("week").value || iso(new Date())) + "T00:00:00");
  let a = [];
  
  if (scope === "week") {
    let count = el("workSaturday").checked ? 6 : 5;
    for(let i=0; i<count; i++) {
      let x = new Date(baseDate);
      x.setDate(x.getDate() + i);
      a.push(x);
    }
  } else if (scope === "day") {
    a.push(baseDate);
  } else if (scope === "month") {
    let year = baseDate.getFullYear(), month = baseDate.getMonth();
    let totalDays = new Date(year, month + 1, 0).getDate();
    for(let i=1; i<=totalDays; i++) {
      let x = new Date(year, month, i);
      if(!el("workSaturday").checked && x.getDay() === 6) continue;
      if(x.getDay() === 0) continue;
      a.push(x);
    }
  }
  return a;
}

function setup() {
  let scope = el("viewScope").value;
  let wrap = el("subSelectWrap");
  let label = el("subSelectLabel");
  let sub = el("subSelect");
  
  el("day").innerHTML = "";
  sub.innerHTML = "";

  let baseDate = new Date((el("week").value || iso(new Date())) + "T00:00:00");

  if(scope === "week") {
    wrap.style.display = "none";
    days().forEach(d => {
      let text = D[(d.getDay()+6)%7] + " · " + d.toLocaleDateString("pl-PL");
      el("day").add(new Option(text, iso(d)));
    });
  } else if(scope === "day") {
    wrap.style.display = "block";
    label.textContent = "Wybór Dnia";
    let weekDays = [];
    let start = new Date(baseDate);
    let count = el("workSaturday").checked ? 6 : 5;
    for(let i=0; i<count; i++) {
      let x = new Date(start);
      x.setDate(x.getDate() + i);
      weekDays.push(x);
    }
    weekDays.forEach(d => {
      let text = D[(d.getDay()+6)%7] + " · " + d.toLocaleDateString("pl-PL");
      sub.add(new Option(text, iso(d)));
      el("day").add(new Option(text, iso(d)));
    });
  } else if(scope === "month") {
    wrap.style.display = "block";
    label.textContent = "Wybór miesiąca";
    for(let m=0; m<12; m++) {
      let d = new Date(baseDate.getFullYear(), m, 1);
      let text = d.toLocaleString("pl-PL", {month:"long", year:"numeric"});
      sub.add(new Option(text, m));
    }
    sub.value = baseDate.getMonth();
    days().forEach(d => {
      let text = D[(d.getDay()+6)%7] + " · " + d.toLocaleDateString("pl-PL");
      el("day").add(new Option(text, iso(d)));
    });
  }
}

const D = ["Poniedziałek","Wtorek","Środa","Czwartek","Piątek","Sobota","Niedziela"];

function addEmployee() {
  let n = el("name").value.trim();
  if(n && !data.employees.some(x => x.toLowerCase() == n.toLowerCase())) data.employees.push(n);
  el("name").value = "";
  save();
  renderPeople();
}

function renderPeople() {
  data.employees.sort((a,b) => a.localeCompare(b,"pl"));
  el("people").innerHTML = data.employees.map(x => "<span class='chip'>"+esc(x)+"</span>").join("") || "<span class='empty'>Brak pozycji</span>";
  let old = el("employee").value;
  el("employee").innerHTML = data.employees.map(x => "<option>"+esc(x)+"</option>").join("");
  el("employee").value = data.employees.includes(old) ? old : (data.employees[0] || "");
}

function saveTask() {
  let employee = el("employee").value, task = el("task").value.trim();
  if(!employee) return alert("Dodaj osobę/firmę.");
  if(!task) return alert("Wpisz treść zadania.");
  
  let isFlex = el("isFlex").checked;
  let a = {
    id: editing || crypto.randomUUID(),
    date: el("day").value,
    time: isFlex ? "" : el("time").value,
    isFlex: isFlex,
    completed: false,
    employee: employee,
    task: task,
    order: el("order").value.trim(),
    notes: el("notes").value.trim()
  };
  
  if(editing) {
    let old = data.assignments.find(x => x.id === editing);
    if(old) a.completed = old.completed;
    data.assignments = data.assignments.map(x => x.id == editing ? a : x);
  } else {
    data.assignments.push(a);
  }
  
  save();
  resetForm();
  render();
  
  // Automatyczne pobranie pliku zaktualizowanego dane.json żebyś mógł go jednym kliknięciem wrzucić na GitHub
  triggerAutoDownloadJson();
}

function triggerAutoDownloadJson() {
  let blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "dane.json";
  a.click();
  el("syncStatus").textContent = "Status: Zaktualizowano dane.json (wrzuć na GitHub)";
}

function toggleTaskComplete(id) {
  let a = data.assignments.find(x => x.id === id);
  if(a) {
    a.completed = !a.completed;
    save();
    render();
    triggerAutoDownloadJson();
  }
}

function editTask(id) {
  let a = data.assignments.find(x => x.id == id);
  if(!a) return;
  editing = id;
  el("formTitle").textContent = "Edycja pozycji";
  el("day").value = a.date;
  el("isFlex").checked = !!a.isFlex;
  toggleFlexTime();
  if(!a.isFlex) el("time").value = a.time || "08:00";
  el("employee").value = a.employee;
  el("task").value = a.task;
  el("order").value = a.order || "";
  el("notes").value = a.notes || "";
  scrollTo({top: 0, behavior: "smooth"});
}

function removeTask(id) {
  if(confirm("Usunąć pozycję?")) {
    data.assignments = data.assignments.filter(x => x.id != id);
    save();
    render();
    triggerAutoDownloadJson();
  }
}

function resetForm() {
  editing = "";
  el("formTitle").textContent = "Nowe zadanie / dostawa";
  el("task").value = "";
  el("order").value = "";
  el("notes").value = "";
  el("isFlex").checked = false;
  toggleFlexTime();
}

function render() {
  let scope = el("viewScope").value;
  let sub = el("subSelect").value;
  let ds = days();
  
  if(scope === "day" && sub) {
    ds = ds.filter(d => iso(d) === sub);
  } else if(scope === "month" && sub !== "") {
    ds = ds.filter(d => d.getMonth() == sub);
  }

  let f = el("filter").value.trim().toLowerCase();
  let items = data.assignments.filter(a => ds.some(d => iso(d) == a.date) && (!f || (a.order||"").toLowerCase().includes(f) || a.task.toLowerCase().includes(f)));

  let period = ds.length > 0 ? (ds[0].toLocaleDateString("pl-PL") + (ds.length > 1 ? " – " + ds[ds.length-1].toLocaleDateString("pl-PL") : "")) : "—";
  
  el("tasks").textContent = items.length;
  el("count").textContent = data.employees.length;
  el("range").textContent = period;
  el("period").textContent = "Zakres: " + period;

  el("schedule").innerHTML = ds.map(d => {
    let daily = items.filter(a => a.date == iso(d));
    daily.sort((a,b) => {
      if(a.isFlex && !b.isFlex) return 1;
      if(!a.isFlex && b.isFlex) return -1;
      return (a.time||"").localeCompare(b.time||"");
    });

    let taskList = daily.map(a => {
      let timeTag = a.isFlex ? "<span class='flex-badge'>FLEX</span>" : "<b>"+esc(a.time)+"</b>";
      let checkBtn = a.isFlex ? "<input type='checkbox' class='task-check' "+(a.completed?"checked":"")+" onchange=\"toggleTaskComplete('"+a.id+"')\" title='Oznacz jako wykonane'>" : "";
      
      return "<div class='task "+(a.completed?'completed':'')+"'>" +
             "  <div class='task-content'>" +
             "    <div>" + timeTag + " <strong>" + esc(a.employee) + "</strong> — " + esc(a.task) + "</div>" +
             "    <small>" + esc(a.order || "brak ID") + (a.notes ? " · " + esc(a.notes) : "") + "</small>" +
             "  </div>" +
             "  <div class='task-actions'>" +
                  checkBtn +
             "    <button class='mini' onclick=\"editTask('"+a.id+"')\">Edytuj</button>" +
             "    <button class='mini' onclick=\"removeTask('"+a.id+"')\">Usuń</button>" +
             "  </div>" +
             "</div>";
    }).join("") || "<div class='empty'>Brak zaplanowanych zadań</div>";

    return "<article class='day'>" +
           "  <div class='day-name'>" + D[(d.getDay()+6)%7] + "<small>" + d.toLocaleDateString("pl-PL") + "</small></div>" +
           "  <div class='tasks-container'>" + taskList + "</div>" +
           "</article>";
  }).join("");
}

function exportData() {
  let blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
  let a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "harmonogram.json";
  a.click();
}

function importData(e) {
  let r = new FileReader();
  r.onload = () => {
    try {
      let x = JSON.parse(r.result);
      if(!Array.isArray(x.employees) || !Array.isArray(x.assignments)) throw 0;
      data = x;
      save();
      renderPeople();
      render();
    } catch(_) { alert("Nieprawidłowy plik JSON."); }
  };
  if(e.target.files[0]) r.readAsText(e.target.files[0]);
}

function clearData() {
  if(confirm("Wyczyścić cały plan?")) {
    data = { employees: [], assignments: [] };
    save();
    renderPeople();
    render();
    triggerAutoDownloadJson();
  }
}

function generatePdf() {
  window.print();
}

el("week").value = iso(monday());
el("week").onchange = () => { setup(); render(); };
syncData();
</script>
</body>
</html>
